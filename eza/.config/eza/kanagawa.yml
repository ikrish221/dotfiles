# Kanagawa Theme for Eza
# Colors are in format of:
# color/paletteRef (Description) #color code

# Fuji White (Text)              #DCD7BA
# Samurai Red (Terminal Red)     #C34043
# Sakura Pink (Terminal Magenta) #D27E99
# Carp Yellow (Terminal Yellow)  #E6C384
# Spring Green (Terminal Green)  #98BB6C
# Crystal Blue (Terminal Blue)   #7E9CD8
# Spring Blue (Terminal Cyan)    #7FB4CA
# Surimi Orange (Accent)         #FF9E64
# Oni Violet (Terminal Purple)   #957FB8
# Fuji Gray (Comments/Ignored)   #727169
# Sumi Ink 4 (Selection/Dark)    #54546D
# Wave Red (Danger)              #E46876

filekinds:
  normal:           {foreground: "#DCD7BA"}
  directory:        {foreground: "#7E9CD8"}
  symlink:          {foreground: "#7FB4CA"}
  pipe:             {foreground: "#957FB8"}
  block_device:     {foreground: "#FF9E64"}
  char_device:      {foreground: "#E6C384"}
  socket:           {foreground: "#54546D"}
  special:          {foreground: "#D27E99"}
  executable:       {foreground: "#98BB6C"}
  mount_point:      {foreground: "#957FB8"}

perms:
  user_read:            {foreground: "#98BB6C"}
  user_write:           {foreground: "#E6C384"}
  user_execute_file:    {foreground: "#C34043"}
  user_execute_other:   {foreground: "#98BB6C"}
  group_read:           {foreground: "#7FB4CA"}
  group_write:          {foreground: "#FF9E64"}
  group_execute:        {foreground: "#98BB6C"}
  other_read:           {foreground: "#727169"}
  other_write:          {foreground: "#C34043"}
  other_execute:        {foreground: "#7E9CD8"}
  special_user_file:    {foreground: "#957FB8"}
  special_other:        {foreground: "#54546D"}
  attribute:            {foreground: "#7FB4CA"}

size:
  major:        {foreground: "#C34043"}
  minor:        {foreground: "#FF9E64"}
  number_byte:  {foreground: "#DCD7BA"}
  number_kilo:  {foreground: "#98BB6C"}
  number_mega:  {foreground: "#E6C384"}
  number_giga:  {foreground: "#FF9E64"}
  number_huge:  {foreground: "#C34043"}
  unit_byte:    {foreground: "#727169"}
  unit_kilo:    {foreground: "#7FB4CA"}
  unit_mega:    {foreground: "#E6C384"}
  unit_giga:    {foreground: "#FF9E64"}
  unit_huge:    {foreground: "#E46876"}

users:
  user_you:     {foreground: "#E6C384"}
  user_root:    {foreground: "#C34043"}
  user_other:   {foreground: "#957FB8"}
  group_yours:  {foreground: "#98BB6C"}
  group_other:  {foreground: "#727169"}
  group_root:   {foreground: "#C34043"}

links:
  normal:           {foreground: "#7FB4CA"}
  multi_link_file:  {foreground: "#E46876"}

git:
  new:         {foreground: "#98BB6C"}
  modified:    {foreground: "#E6C384"}
  deleted:     {foreground: "#C34043"}
  renamed:     {foreground: "#FF9E64"}
  typechange:  {foreground: "#D27E99"}
  ignored:     {foreground: "#727169"}
  conflicted:  {foreground: "#E46876"}

git_repo:
  branch_main:  {foreground: "#98BB6C"}
  branch_other: {foreground: "#957FB8"}
  git_clean:    {foreground: "#98BB6C"}
  git_dirty:    {foreground: "#E6C384"}

security_context:
  colon: {foreground: "#727169"}
  user:  {foreground: "#DCD7BA"}
  role:  {foreground: "#957FB8"}
  typ:   {foreground: "#7FB4CA"}
  range: {foreground: "#E6C384"}

file_type:
  image:       {foreground: "#E6C384"}
  video:       {foreground: "#D27E99"}
  music:       {foreground: "#957FB8"}
  lossless:    {foreground: "#7FB4CA"}
  crypto:      {foreground: "#98BB6C"}
  document:    {foreground: "#DCD7BA"}
  compressed:  {foreground: "#FF9E64"}
  temp:        {foreground: "#727169"}
  compiled:    {foreground: "#FF9E64"}
  build:       {foreground: "#E6C384"}
  source:      {foreground: "#7E9CD8"}

punctuation: {foreground: "#727169"}
date:        {foreground: "#7FB4CA"}
inode:       {foreground: "#957FB8"}
blocks:      {foreground: "#727169"}
header:      {foreground: "#DCD7BA"}
octal:       {foreground: "#7FB4CA"}
flags:       {foreground: "#E6C384"}

symlink_path:        {foreground: "#7E9CD8"}
control_char:        {foreground: "#C34043"}
broken_symlink:      {foreground: "#E46876"}
broken_path_overlay: {foreground: "#54546D"}

