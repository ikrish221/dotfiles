add_newline = true

# Minimal, calm, left-aligned
format = "$directory$git_branch$git_status$character"
palette = "reverse_void"

[character]
success_symbol = "[❯](ink)"
error_symbol   = "[❯](error)"

[directory]
format = "[$path ]($style)"
style = "ink"

[directory.substitutions]
"Documents" = "doc/"
"Downloads" = "dl/"
"Music"     = "snd/"
"Pictures"  = "img/"
"Developer" = "wrk/"

[git_branch]
symbol = ""
format = "[$branch ]($style)"
style = "faded"

[git_status]
format = "[($all_status$ahead_behind)]($style)"
style = "warn"

[cmd_duration]
disabled = true

# --- Languages (kept disabled, reverse-void ready) ---

[c]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[python]
disabled = true

# --- Containers / infra ---

[docker_context]
symbol = ""
format = "[$context ]($style)"
style = "muted"

[kubernetes]
disabled = true

[aws]
disabled = true

[conda]
disabled = true

# --- OS (silent, aesthetic only) ---

[os]
disabled = true

# =========================
# 🎨 Reverse Void Palette
# =========================

[palettes.reverse_void]
ink        = "#1F1F1F"   # primary text (almost black)
faded      = "#6B6B6B"   # git branch
muted      = "#8A8A8A"   # docker / secondary
warn       = "#9C7C38"   # subtle yellow-brown
error      = "#8C3A3A"   # muted red
background = "#F6F4EE"   # paper white (reference only)
