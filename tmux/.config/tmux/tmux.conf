source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal "screen-256color"
set-option -g terminal-overrides ',xterm-256color:RGB'




# Tmux Custom Theme
set-option -g status-style bg=default
set-option -g status-style fg=#9ccfd8,bold
set-option -g status-right ""
set-option -g status-left "#[fg=#ebbcba,bg=default]#[fg=#191724,bg=#ebbcba,bold] #S #[fg=#ebbcba,bg=default,nobold]#[default]"
set-option -g status-right "#[fg=#ebbcba,bg=default]#[fg=#191724,bg=#ebbcba,bold] %H:%M #[fg=#ebbcba,bg=default,nobold]#[default]"
set-option -g status-left-length 30
set-option -g window-status-current-format "#[fg=#ebbcba,bg=default]#[fg=#191724,bg=#ebbcba,bold] #I:#W #[fg=#ebbcba,bg=default,nobold]#[default]"
set -g status-justify "absolute-centre"


set -g prefix ^A
set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
set -g default-terminal "${TERM}"
set -g mouse on
setw -g mode-keys vi
set-hook -g session-created "rename-window -t 1 init"

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
set -g @resurrect-strategy-nvim 'session'

run '~/.tmux/plugins/tpm/tpm'
